<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SeeTalk · AI 视觉对话助手</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>SeeTalk</h1>
    <span class="sub">视觉对话助手 · PR1 抓帧问答闭环</span>
    <span id="badge" class="badge">检测中…</span>
  </header>

  <main>
    <section class="cam">
      <!-- 隐私:UI 常驻"正在看"指示(design.md §25) -->
      <div class="watching">👁 摄像头预览（仅提问瞬间抓 1 帧上行）</div>
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" hidden></canvas>
      <div class="cam-controls">
        <button id="startCam">开启摄像头</button>
        <button id="stopCam" disabled>暂停</button>
      </div>
      <div class="cam-controls">
        <button id="contBtn" type="button" class="toggle">▶ 连续分析（会议辅助）</button>
        <button id="summaryBtn" type="button" class="toggle">生成纪要</button>
      </div>
      <div id="obsLog" class="obslog"></div>
    </section>

    <section class="chat">
      <div class="voicebar">
        <button id="micBtn" type="button">🎤 开始语音</button>
        <span id="voiceState" class="vstate">未开始</span>
        <button id="ttsToggle" type="button" class="toggle">TTS：浏览器</button>
        <button id="asrToggle" type="button" class="toggle">ASR：自动</button>
      </div>
      <div id="log" class="log"></div>
      <form id="askForm">
        <input id="question" type="text" autocomplete="off"
               placeholder="举起书 / 对准报错，说话或打字…">
        <button id="askBtn" type="submit">提问</button>
      </form>
      <p class="hint">免手语音：点「开始语音」后直接说话（VAD 自动断句）。桌面默认浏览器 Web Speech，移动端走百炼；可手动切换。</p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='tts.js') }}"></script>
  <script src="{{ url_for('static', filename='voice.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
